# Site configuration for mattmandav.github.io
# Changes here need a restart of `jekyll serve` to show up locally.

# Basic site settings
locale                   : "en-UK"
title                    : "Matthew Davison"
title_separator          : "-"
name                     : "Matthew Davison"
description              : "Matthew Davison's website"
url                      : https://mattmandav.github.io
baseurl                  : ""
repository               : "Mattmandav/mattmandav.github.io"

# Sidebar author profile (edit /_includes/author-profile.html for layout)
author:
  avatar           : "profile.jpg"
  name             : "Matthew Davison"
  pronouns         : "he/him"
  bio              : "Holder of a PhD in Operational Research and Statistics. Has various industry experience."
  location         : "Århus, Danmark"
  employer         : "Aarhus Universitet"
  email            : "md@math.au.dk"
  academia         : "https://www.au.dk/en/md@math.au.dk"
  googlescholar    : "https://scholar.google.com/citations?user=z1qtLB4AAAAJ"
  orcid            : "https://orcid.org/0009-0001-5686-9640"
  github           : "Mattmandav"
  linkedin         : "matthew-davison-2t1d"

# Site settings
breadcrumbs              : false
read_more                : "disabled"
atom_feed:
  hide                   : true

# Reading files
include:
  - _pages
exclude:
  - .devcontainer
  - .sass-cache
  - .jekyll-cache
  - assets/js/_main.js
  - assets/js/plugins
  - Dockerfile
  - docker-compose.yaml
  - _config_docker.yml
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - node_modules
  - package.json
  - vendor
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# Page defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Output
permalink: /:categories/:title/
timezone: Europe/Copenhagen

# Plugins (all supported by GitHub Pages)
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
whitelist:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

# HTML compression
compress_html:
  clippings: all
  ignore:
    envs: development
